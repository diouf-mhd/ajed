# PostgreSQL local pour le développement : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ajed
      POSTGRES_PASSWORD: ajed
      POSTGRES_DB: ajed
    ports: ["5432:5432"]
    volumes: ["ajed_pg:/var/lib/postgresql/data"]
volumes:
  ajed_pg:
